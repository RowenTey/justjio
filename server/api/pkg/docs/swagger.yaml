openapi: 3.0.1
info:
  title: JustJio API
  description: API server for JustJio.
  contact: {}
  version: "1.0"
servers:
  - url: http://localhost:8080/v1
paths:
  /auth:
    post:
      tags:
        - Authentication
      summary: Login
      description: Authenticates a user with username and password
      requestBody:
        description: Login credentials
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/request.LoginRequest"
        required: true
      responses:
        "200":
          description: Login successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/response.AuthResponse"
                  message:
                    type: string
                  status:
                    type: string
                  token:
                    type: string
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
        "401":
          description: Invalid username or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
      x-codegen-request-body-name: credentials
  /auth/google:
    post:
      tags:
        - Authentication
      summary: Google OAuth login
      description: Authenticates a user using Google OAuth authorization code
      requestBody:
        description: Google OAuth request
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/request.GoogleAuthRequest"
        required: true
      responses:
        "200":
          description: Authenticated via Google successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/response.AuthResponse"
                  message:
                    type: string
                  status:
                    type: string
                  token:
                    type: string
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
      x-codegen-request-body-name: google
  /auth/otp:
    post:
      tags:
        - Authentication
      summary: Send OTP email
      description:
        Sends a One-Time Password to the user's email for verification
        or password reset
      requestBody:
        description: OTP email request
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/request.SendOTPEmailRequest"
        required: true
      responses:
        "200":
          description: OTP sent successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
        "400":
          description: Invalid input or invalid purpose
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
        "409":
          description: Email already verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
      x-codegen-request-body-name: otp
  /auth/reset:
    post:
      tags:
        - Authentication
      summary: Reset password
      description: Resets the user's password after OTP verification
      requestBody:
        description: Password reset request
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/request.ResetPasswordRequest"
        required: true
      responses:
        "200":
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
      x-codegen-request-body-name: reset
  /auth/signup:
    post:
      tags:
        - Authentication
      summary: Sign up
      description: Creates a new user account with email verification
      requestBody:
        description: User registration details
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/request.SignUpRequest"
        required: true
      responses:
        "200":
          description: User signed up successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/response.AuthResponse"
                  message:
                    type: string
                  status:
                    type: string
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
        "409":
          description: Username or email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
      x-codegen-request-body-name: signUpRequest
  /auth/verify:
    post:
      tags:
        - Authentication
      summary: Verify OTP
      description: Verifies the One-Time Password sent to the user's email
      requestBody:
        description: OTP verification request
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/request.VerifyOTPRequest"
        required: true
      responses:
        "200":
          description: OTP verified successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
        "400":
          description: Invalid input or invalid OTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
        "404":
          description: User not found or OTP not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
      x-codegen-request-body-name: otp
  /bills:
    get:
      tags:
        - Bills
      summary: Get bills by room
      description: Retrieves all bills for a specified room
      parameters:
        - name: roomId
          in: query
          description: Room ID
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Retrieved bills successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/response.BillDto"
                  message:
                    type: string
                  status:
                    type: string
        "400":
          description: Missing roomId in query parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
        "404":
          description: Room not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
      security:
        - BearerAuth: []
    post:
      tags:
        - Bills
      summary: Create bill
      description: Creates a new bill for a room with specified payers and amount
      requestBody:
        description: Bill creation details
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/request.CreateBillRequest"
        required: true
      responses:
        "200":
          description: Created bill successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: string
                  message:
                    type: string
                  status:
                    type: string
        "400":
          description: "Invalid input, empty payers, or room already consolidated"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
        "404":
          description: Room not found or payers not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
      security:
        - BearerAuth: []
      x-codegen-request-body-name: bill
  /bills/consolidate:
    post:
      tags:
        - Bills
      summary: Consolidate bills
      description: Consolidates all bills for a room into transactions (host only)
      requestBody:
        description: Consolidation request
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/request.ConsolidateBillsRequest"
        required: true
      responses:
        "200":
          description: Bill consolidated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
        "400":
          description: Invalid input or bills already consolidated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
        "403":
          description: Only host can consolidate bills
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
        "404":
          description: Room not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
      security:
        - BearerAuth: []
      x-codegen-request-body-name: consolidation
  /notifications:
    post:
      tags:
        - Notifications
      summary: Create notification
      description: Creates and sends a new notification to a user
      requestBody:
        description: Notification details
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/request.CreateNotificationRequest"
        required: true
      responses:
        "200":
          description: Notification created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
        "400":
          description: Invalid input or empty content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
      security:
        - BearerAuth: []
      x-codegen-request-body-name: notification
  /notifications/{id}:
    get:
      tags:
        - Notifications
      summary: Get notification by ID
      description: Retrieves a specific notification by its ID
      parameters:
        - name: id
          in: path
          description: Notification ID
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Retrieved notification successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/response.NotificationDto"
                  message:
                    type: string
                  status:
                    type: string
        "400":
          description: Invalid notification ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
        "404":
          description: Notification not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
      security:
        - BearerAuth: []
  /rooms:
    get:
      tags:
        - Rooms
      summary: Get user's rooms
      description: Retrieves a paginated list of rooms for the authenticated user
      parameters:
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            default: 1
      responses:
        "200":
          description: Retrieved rooms successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/response.RoomListDto"
                  message:
                    type: string
                  status:
                    type: string
        "404":
          description: No rooms found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
      security:
        - BearerAuth: []
    post:
      tags:
        - Rooms
      summary: Create room
      description: Creates a new room and optionally sends invites to specified users
      requestBody:
        description: Room creation details
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/request.CreateRoomRequest"
        required: true
      responses:
        "200":
          description: Created room successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: string
                  message:
                    type: string
                  status:
                    type: string
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
        "500":
          description: Failed to create room and invites
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
      security:
        - BearerAuth: []
      x-codegen-request-body-name: room
  /rooms/{roomId}:
    get:
      tags:
        - Rooms
      summary: Get room details
      description: Retrieves details of a specific room by its ID
      parameters:
        - name: roomId
          in: path
          description: Room ID
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Retrieved room successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/response.RoomDto"
                  message:
                    type: string
                  status:
                    type: string
        "404":
          description: Room not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
      security:
        - BearerAuth: []
    post:
      tags:
        - Room Invites
      summary: Invite users to room
      description: Invites multiple users to a room (host only)
      parameters:
        - name: roomId
          in: path
          description: Room ID
          required: true
          schema:
            type: string
      requestBody:
        description: User invites details
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/request.InviteUserRequest"
        required: true
      responses:
        "200":
          description: Invited users successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
        "403":
          description: Only hosts are allowed to invite users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
        "404":
          description: Room / User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
        "409":
          description: User is already in the room or already has pending invite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
      security:
        - BearerAuth: []
      x-codegen-request-body-name: invites
    patch:
      tags:
        - Room Invites
      summary: Respond to room invitation
      description: Accepts or rejects a room invitation
      parameters:
        - name: roomId
          in: path
          description: Room ID
          required: true
          schema:
            type: string
      requestBody:
        description: Invitation response
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/request.RespondToRoomInviteRequest"
        required: true
      responses:
        "200":
          description: Joined room successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/response.RoomDto"
                  message:
                    type: string
                  status:
                    type: string
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
        "404":
          description: Room not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
      security:
        - BearerAuth: []
      x-codegen-request-body-name: response
  /rooms/{roomId}/close:
    patch:
      tags:
        - Rooms
      summary: Close room
      description: "Closes a room (host only, no unconsolidated bills allowed)"
      parameters:
        - name: roomId
          in: path
          description: Room ID
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Closed room successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
        "401":
          description: Only hosts are allowed to close rooms
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
        "404":
          description: Room not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
        "409":
          description: Cannot close room with unconsolidated bills
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
      security:
        - BearerAuth: []
  /rooms/{roomId}/edit:
    patch:
      tags:
        - Rooms
      summary: Edit room
      description: Updates details of an existing room (host only)
      parameters:
        - name: roomId
          in: path
          description: Room ID
          required: true
          schema:
            type: string
      requestBody:
        description: Room update details
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/request.EditRoomRequest"
        required: true
      responses:
        "200":
          description: Edited room successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
        "401":
          description: Only hosts can edit rooms
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
        "404":
          description: Room not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
      security:
        - BearerAuth: []
      x-codegen-request-body-name: room
  /rooms/{roomId}/join:
    patch:
      tags:
        - Rooms
      summary: Join room
      description: Allows a user to join a room
      parameters:
        - name: roomId
          in: path
          description: Room ID
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Joined room successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/response.RoomDto"
                  message:
                    type: string
                  status:
                    type: string
        "404":
          description: Room not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
        "409":
          description: User is already in room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
      security:
        - BearerAuth: []
  /rooms/{roomId}/leave:
    delete:
      tags:
        - Rooms
      summary: Leave room
      description:
        Allows a user to leave a room (not allowed for hosts or with unconsolidated
        bills)
      parameters:
        - name: roomId
          in: path
          description: Room ID
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Left room successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
        "404":
          description: Room not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
        "409":
          description:
            Cannot leave room with unconsolidated bills or host cannot
            leave room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
      security:
        - BearerAuth: []
  /rooms/{roomId}/messages:
    get:
      tags:
        - Messages
      summary: Get room messages
      description:
        Retrieves paginated messages for a specific room with optional
        sorting
      parameters:
        - name: roomId
          in: path
          description: Room ID
          required: true
          schema:
            type: string
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            default: 1
        - name: asc
          in: query
          description: Sort order (ascending if true)
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: Retrieved messages successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/response.GetMessagesResponse"
                  message:
                    type: string
                  status:
                    type: string
        "404":
          description: No messages found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
      security:
        - BearerAuth: []
    post:
      tags:
        - Messages
      summary: Create message
      description: Creates and saves a new message in the specified room
      parameters:
        - name: roomId
          in: path
          description: Room ID
          required: true
          schema:
            type: string
      requestBody:
        description: Message content
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/request.CreateMessageRequest"
        required: true
      responses:
        "200":
          description: Message saved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
        "404":
          description: Room or user not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/utils.EmptyApiResponse"
      security:
        - BearerAuth: []
      x-codegen-request-body-name: message
  /rooms/{roomId}/messages/{msgId}:
    get:
      tags:
        - Messages
      summary: Get message by ID
      description: Retrieves a specific message by its ID
      parameters:
        - name: msgId
          in: path
          description: Message ID
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Retrieved message successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/models.Message"
                  message:
                    type: string
                  status:
