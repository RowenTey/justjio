basePath: /api/v1
definitions:
  model.Bill:
    properties:
      amount:
        type: number
      consolidation:
        $ref: '#/definitions/model.Consolidation'
      consolidationId:
        type: integer
      date:
        type: string
      id:
        type: integer
      includeOwner:
        type: boolean
      name:
        type: string
      owner:
        allOf:
        - $ref: '#/definitions/model.User'
        description: Associations
      ownerId:
        type: integer
      payers:
        items:
          $ref: '#/definitions/model.User'
        type: array
      room:
        $ref: '#/definitions/model.Room'
      roomId:
        type: string
    type: object
  model.Consolidation:
    properties:
      createdAt:
        type: string
      id:
        type: integer
    type: object
  model.FriendRequest:
    properties:
      id:
        type: integer
      receiver:
        $ref: '#/definitions/model.User'
      receiverId:
        type: integer
      respondedAt:
        type: string
      sender:
        allOf:
        - $ref: '#/definitions/model.User'
        description: Associations
      senderId:
        type: integer
      sentAt:
        type: string
      status:
        type: string
    type: object
  model.Message:
    properties:
      content:
        type: string
      id:
        type: integer
      room:
        $ref: '#/definitions/model.Room'
      roomId:
        type: string
      sender:
        allOf:
        - $ref: '#/definitions/model.User'
        description: Associations
      senderId:
        type: integer
      sentAt:
        type: string
    type: object
  model.Notification:
    properties:
      content:
        type: string
      createdAt:
        type: string
      id:
        type: integer
      isRead:
        type: boolean
      title:
        type: string
      updatedAt:
        type: string
      userId:
        type: integer
    type: object
  model.Room:
    properties:
      attendees:
        items:
          $ref: '#/definitions/model.User'
        type: array
      consolidated:
        type: string
      createdAt:
        type: string
      date:
        type: string
      description:
        type: string
      host:
        allOf:
        - $ref: '#/definitions/model.User'
        description: Associations
      hostId:
        type: integer
      id:
        type: string
      imageUrl:
        type: string
      isClosed:
        type: boolean
      isPrivate:
        type: boolean
      name:
        type: string
      noOfAttendees:
        type: integer
      time:
        type: string
      updatedAt:
        type: string
      venue:
        type: string
      venuePlaceId:
        type: string
      venueUrl:
        type: string
    type: object
  model.RoomInvite:
    properties:
      createdAt:
        type: string
      id:
        type: integer
      inviter:
        $ref: '#/definitions/model.User'
      inviterId:
        type: integer
      room:
        $ref: '#/definitions/model.Room'
      roomId:
        type: string
      status:
        description: Invite status (pending, accepted, rejected)
        type: string
      user:
        allOf:
        - $ref: '#/definitions/model.User'
        description: Associations
      userId:
        type: integer
    type: object
  model.Subscription:
    properties:
      auth:
        type: string
      endpoint:
        type: string
      id:
        type: string
      p256dh:
        type: string
      userId:
        type: integer
    type: object
  model.Transaction:
    properties:
      amount:
        type: number
      consolidation:
        $ref: '#/definitions/model.Consolidation'
      consolidationId:
        type: integer
      id:
        type: integer
      isPaid:
        type: boolean
      paidOn:
        type: string
      payee:
        $ref: '#/definitions/model.User'
      payeeId:
        type: integer
      payer:
        allOf:
        - $ref: '#/definitions/model.User'
        description: Associations
      payerId:
        type: integer
    type: object
  model.User:
    properties:
      email:
        type: string
      friends:
        items:
          $ref: '#/definitions/model.User'
        type: array
      id:
        type: integer
      isEmailValid:
        type: boolean
      isOnline:
        type: boolean
      lastSeen:
        type: string
      noOfFriends:
        type: integer
      noOfPendingFriendRequests:
        type: integer
      noOfRoomInvites:
        type: integer
      noOfRooms:
        type: integer
      password:
        type: string
      pictureUrl:
        type: string
      registeredAt:
        type: string
      rooms:
        description: Associations
        items:
          $ref: '#/definitions/model.Room'
        type: array
      updatedAt:
        type: string
      username:
        type: string
    type: object
  model_location.Venue:
    properties:
      address:
        type: string
      googleMapsPlaceId:
        type: string
      name:
        type: string
    type: object
  request.ConsolidateBillsRequest:
    properties:
      roomId:
        type: string
    type: object
  request.CreateBillRequest:
    properties:
      amount:
        type: number
      includeOwner:
        type: boolean
      name:
        type: string
      payers:
        items:
          type: integer
        type: array
      roomId:
        type: string
    type: object
  request.CreateMessageRequest:
    properties:
      content:
        type: string
    type: object
  request.CreateNotificationRequest:
    properties:
      content:
        type: string
      title:
        type: string
      userId:
        type: integer
    type: object
  request.CreateRoomRequest:
    properties:
      invitees:
        items:
          type: string
        type: array
      room:
        $ref: '#/definitions/model.Room'
    type: object
  request.GoogleAuthRequest:
    properties:
      code:
        type: string
    type: object
  request.InviteUserRequest:
    properties:
      invitees:
        items:
          type: string
        type: array
    type: object
  request.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  request.ModifyFriendRequest:
    properties:
      friendId:
        type: integer
    type: object
  request.ResetPasswordRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  request.RespondToFriendRequestRequest:
    properties:
      action:
        type: string
      requestId:
        type: integer
    type: object
  request.RespondToRoomInviteRequest:
    properties:
      accept:
        type: boolean
    type: object
  request.SendOTPEmailRequest:
    properties:
      email:
        type: string
      purpose:
        type: string
    type: object
  request.UpdateRoomRequest:
    properties:
      date:
        type: string
      description:
        type: string
      placeId:
        type: string
      time:
        type: string
      venue:
        type: string
    type: object
  request.UpdateUserRequest:
    properties:
      field:
        type: string
      value:
        type: string
    type: object
  request.VerifyOTPRequest:
    properties:
      email:
        type: string
      otp:
        type: string
    type: object
  response.AttendeesDto:
    properties:
      id:
        type: integer
      username:
        type: string
    type: object
  response.AuthResponse:
    properties:
      email:
        type: string
      id:
        type: integer
      pictureUrl:
        type: string
      username:
        type: string
    type: object
  response.CountPendingRequestsResponse:
    properties:
      count:
        type: integer
    type: object
  response.CreateRoomResponse:
    properties:
      invites:
        items:
          $ref: '#/definitions/model.RoomInvite'
        type: array
      room:
        $ref: '#/definitions/model.Room'
    type: object
  response.GetNumRoomInvitationsResponse:
    properties:
      count:
        type: integer
    type: object
  response.GetNumRoomsResponse:
    properties:
      count:
        type: integer
    type: object
  response.JoinRoomResponse:
    properties:
      attendees:
        items:
          $ref: '#/definitions/model.User'
        type: array
      room:
        $ref: '#/definitions/model.Room'
    type: object
  response.RoomDto:
    properties:
      attendees:
        items:
          $ref: '#/definitions/response.AttendeesDto'
        type: array
      consolidated:
        type: string
      date:
        type: string
      description:
        type: string
      host:
        $ref: '#/definitions/response.AttendeesDto'
      id:
        type: string
      imageUrl:
        type: string
      isClosed:
        type: boolean
      isPrivate:
        type: boolean
      name:
        type: string
      noOfAttendees:
        type: integer
      time:
        type: string
      venue:
        type: string
      venueUrl:
        type: string
    type: object
  utils.EmptyApiResponse:
    properties:
      data:
        type: object
      message:
        example: Operation completed successfully
        type: string
      status:
        example: success
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API server for JustJio.
  title: JustJio API
  version: "1.0"
paths:
  /auth/google:
    post:
      consumes:
      - application/json
      description: Authenticates a user using Google OAuth authorization code
      parameters:
      - description: Google OAuth request
        in: body
        name: google
        required: true
        schema:
          $ref: '#/definitions/request.GoogleAuthRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Authenticated via Google successfully
          schema:
            properties:
              data:
                $ref: '#/definitions/response.AuthResponse'
              message:
                type: string
              status:
                type: string
              token:
                type: string
            type: object
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/utils.EmptyApiResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.EmptyApiResponse'
      summary: Google OAuth login
      tags:
      - Authentication
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user with username and password
      parameters:
      - description: Login credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/request.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successfully
          schema:
            properties:
              data:
                $ref: '#/definitions/response.AuthResponse'
              message:
                type: string
              status:
                type: string
              token:
                type: string
            type: object
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/utils.EmptyApiResponse'
        "401":
          description: Invalid username or password
          schema:
            $ref: '#/definitions/utils.EmptyApiResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/utils.EmptyApiResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.EmptyApiResponse'
      summary: Login
      tags:
      - Authentication
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: Resets the user's password after OTP verification
      parameters:
      - description: Password reset request
        in: body
        name: reset
        required: true
        schema:
          $ref: '#/definitions/request.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password reset successfully
          schema:
            $ref: '#/definitions/utils.EmptyApiResponse'
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/utils.EmptyApiResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/utils.EmptyApiResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.EmptyApiResponse'
      summary: Reset password
      tags:
      - Authentication
  /auth/send-otp:
    post:
      consumes:
      - application/json
      description: Sends a One-Time Password to the user's email for verification
        or password reset
      parameters:
      - description: OTP email request
        in: body
        name: otp
        required: true
        schema:
          $ref: '#/definitions/request.SendOTPEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OTP sent successfully
          schema:
            $ref: '#/definitions/utils.EmptyApiResponse'
        "400":
          description: Invalid input or invalid purpose
          schema:
            $ref: '#/definitions/utils.EmptyApiResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/utils.EmptyApiResponse'
        "409":
          description: Email already verified
          schema:
            $ref: '#/definitions/utils.EmptyApiResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.EmptyApiResponse'
      summary: Send OTP email
      tags:
      - Authentication
  /auth/signup:
    post:
      consumes:
      - application/json
      description: Creates a new user account with email verification
      parameters:
      - description: User registration details
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/model.User'
      produces:
      - application/json
      responses:
        "200":
          description: User signed up successfully
          schema:
            properties:
              data:
                $ref: '#/definitions/response.AuthResponse'
              message:
                type: string
              status:
                type: string
            type: object
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/utils.EmptyApiResponse'
        "409":
          description: Username or email already exists
          schema:
            $ref: '#/definitions/utils.EmptyApiResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.EmptyApiResponse'
      summary: Sign up
      tags:
      - Authentication
  /auth/verify-otp:
    post:
      consumes:
      - application/json
      description: Verifies the One-Time Password sent to the user's email
      parameters:
      - description: OTP verification request
        in: body
        name: otp
        required: true
        schema:
          $ref: '#/definitions/request.VerifyOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OTP verified successfully
          schema:
            $ref: '#/definitions/utils.EmptyApiResponse'
        "400":
          description: Invalid input or invalid OTP
          schema:
            $ref: '#/definitions/utils.EmptyApiResponse'
        "404":
          description: User not found or OTP not found
          schema:
            $ref: '#/definitions/utils.EmptyApiResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.EmptyApiResponse'
      summary: Verify OTP
      tags:
      - Authentication
  /bills:
    get:
      consumes:
      - application/json
      description: Retrieves all bills for a specified room
      parameters:
      - description: Room ID
        in: query
        name: roomId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Retrieved bills successfully
          schema:
            properties:
              data:
                items:
                  $ref: '#/definitions/model.Bill'
                type: array
              message:
                type: string
              status:
                type: string
            type: object
        "400":
          description: Missing roomId in query parameter
          schema:
            $ref: '#/definitions/utils.EmptyApiResponse'
        "404":
          description: Room not found
          schema:
            $ref: '#/definitions/utils.EmptyApiResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.EmptyApiResponse'
      summary: Get bills by room
      tags:
      - Bills
    post:
      consumes:
      - application/json
      description: Creates a new bill for a room with specified payers and amount
      parameters:
      - description: Bill creation details
        in: body
        name: bill
        required: true
        schema:
          $ref: '#/definitions/request.CreateBillRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Created bill successfully
          schema:
            properties:
              data:
                $ref: '#/definitions/model.Bill'
              message:
                type: string
              status:
                type: string
            type: object
        "400":
          description: Invalid input, empty payers, or room already consolidated
          schema:
            $ref: '#/definitions/utils.EmptyApiResponse'
        "404":
          description: Room not found or payers not found
          schema:
            $ref: '#/definitions/utils.EmptyApiResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.EmptyApiResponse'
      security:
      - BearerAuth: []
      summary: Create bill
      tags:
      - Bills
  /bills/consolidate:
    post:
      consumes:
      - application/json
      description: Consolidates all bills for a room into transactions (host only)
      parameters:
      - description: Consolidation request
        in: body
        name: consolidation
        required: true
        schema:
          $ref: '#/definitions/request.ConsolidateBillsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Bill consolidated successfully
          schema:
            $ref: '#/definitions/utils.EmptyApiResponse'
        "400":
          description: Invalid input or bills already consolidated
          schema:
            $ref: '#/definitions/utils.EmptyApiResponse'
        "403":
          description: Only host can consolidate bills
          schema:
            $ref: '#/definitions/utils.EmptyApiResponse'
        "404":
          description: Room not found
          schema:
            $ref: '#/definitions/utils.EmptyApiResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.EmptyApiResponse'
      security:
      - BearerAuth: []
      summary: Consolidate bills
      tags:
      - Bills
  /bills/rooms/{roomId}/consolidation-status:
    get:
      consumes:
      - application/json
      description: Checks whether bills for a specific room have been consolidated
      parameters:
      - description: Room ID
        in: path
        name: roomId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Retrieved consolidation status successfully
          schema:
            properties:
              data:
                properties:
                  isConsolidated:
                    type: boolean
                type: object
              message:
                type: string
              status:
                type: string
            type: object
        "400":
          description: Missing roomId in path parameter
          schema:
            $ref: '#/definitions/utils.EmptyApiResponse'
        "404":
          description: Room not found
          schema:
            $ref: '#/definitions/utils.EmptyApiResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.EmptyApiResponse'
      summary: Check bill consolidation status
      tags:
      - Bills
  /messages/{msgId}:
    get:
      consumes:
      - application/json
      description: Retrieves a specific message by its ID
      parameters:
      - description: Message ID
        in: path
        name: msgId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Retrieved message successfully
          schema:
            properties:
              data:
                $ref: '#/definitions/model.Message'
              message:
                type: string
              status:
                type: string
            type: object
        "404":
          description: No message found
          schema:
            $ref: '#/definitions/utils.EmptyApiResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.EmptyApiResponse'
      summary: Get message by ID
      tags:
      - Messages
  /notifications:
    get:
      consumes:
      - application/json
      description: Retrieves all notifications for the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: Retrieved notifications successfully
          schema:
            properties:
              data:
                items:
                  $ref: '#/definitions/model.Notification'
                type: array
              message:
                type: string
              status:
                type: string
            type: object
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/utils.EmptyApiResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.EmptyApiResponse'
      security:
      - BearerAuth: []
      summary: Get user notifications
      tags:
      - Notifications
    post:
      consumes:
      - application/json
      description: Creates and sends a new notification to a user
      parameters:
      - description: Notification details
        in: body
        name: notification
        required: true
        schema:
          $ref: '#/definitions/request.CreateNotificationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Notification created successfully
          schema:
            $ref: '#/definitions/utils.EmptyApiResponse'
        "400":
          description: Invalid input or empty content
          schema:
            $ref: '#/definitions/utils.EmptyApiResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.EmptyApiResponse'
      summary: Create notification
      tags:
      - Notifications
  /notifications/{id}:
    get:
      consumes:
      - application/json
      description: Retrieves a specific notification by its ID
      parameters:
      - description: Notification ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Retrieved notification successfully
          schema:
            properties:
              data:
                $ref: '#/definitions/model.Notification'
              message:
                type: string
              status:
                type: string
            type: object
        "400":
          description: Invalid notification ID
          schema:
            $ref: '#/definitions/utils.EmptyApiResponse'
        "404":
          description: Notification not found
          schema:
            $ref: '#/definitions/utils.EmptyApiResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.EmptyApiResponse'
      summary: Get notification by ID
      tags:
      - Notifications
  /notifications/{id}/read:
    patch:
      consumes:
      - application/json
      description: Marks a specific notification as read by its ID
      parameters:
      - description: Notification ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Notification marked as read successfully
          schema:
            $ref: '#/definitions/utils.EmptyApiResponse'
        "400":
          description: Invalid notification ID
          schema:
            $ref: '#/definitions/utils.EmptyApiResponse'
        "404":
          description: Notification not found
          schema:
            $ref: '#/definitions/utils.EmptyApiResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.EmptyApiResponse'
      summary: Mark notification as read
      tags:
      - Notifications
  /rooms:
    get:
      consumes:
      - application/json
      description: Retrieves a paginated list of rooms for the authenticated user
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Retrieved rooms successfully
          schema:
            properties:
              data:
                items:
                  $ref: '#/definitions/model.Room'
                type: array
              message:
                type: string
              status:
                type: string
            type: object
        "404":
          description: No rooms found
          schema:
            $ref: '#/definitions/utils.EmptyApiResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.EmptyApiResponse'
      security:
      - BearerAuth: []
      summary: Get user's rooms
      tags:
      - Rooms
    post:
      consumes:
      - application/json
      description: Creates a new room and optionally sends invitations to specified
        users
      parameters:
      - description: Room creation details
        in: body
        name: room
        required: true
        schema:
          $ref: '#/definitions/request.CreateRoomRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Created room successfully
          schema:
            properties:
              data:
                $ref: '#/definitions/response.CreateRoomResponse'
              message:
                type: string
              status:
                type: string
            type: object
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/utils.EmptyApiResponse'
        "500":
          description: Failed to create room and invites
          schema:
